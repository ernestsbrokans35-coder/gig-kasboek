<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gig Kasboek</title>
<meta name="description" content="Freelance books on your phone: invoices from your email, VAT per quarter, hours, earnings and expenses. Everything stays on your device.">
<meta name="theme-color" content="#0E6B4E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
html { padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px) }
body { margin: 0 }
[hidden] { display: none !important }
/*__CSS__*/
nav.tabs div { grid-template-columns: repeat(4, 1fr) }
.block p { margin: 0 }
.chips { display: flex; flex-wrap: wrap; gap: 8px }
.chips button { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 6px 12px; font-size: 13px; max-width: 100%; overflow-wrap: anywhere; text-align: left }
.chips button b { color: var(--late); font-weight: 600; margin-left: 6px }
.inline { display: flex; gap: 8px }
.inline input { flex: 1; min-width: 0; min-height: 42px; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); font-size: 16px }
.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 14px }
.tapbig { background: none; border: 0; padding: 0; text-align: left; display: flex; align-items: baseline; gap: 10px; width: 100% }
.tapbig i { font: 500 13px var(--sans); font-style: normal; color: var(--accent); letter-spacing: 0; white-space: nowrap }
.month.wide { grid-template-columns: 52px 1fr 88px }
.back { align-self: flex-start; font-size: 14px }
/* Opening screen: brand green in both themes, shown for a moment on a cold start. */
#splash { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px;
  background: radial-gradient(120% 80% at 50% 38%, #0E5741, #04211A); color: #FCFDFA; text-align: center; transition: opacity .35s ease }
#splash.out { opacity: 0; pointer-events: none }
#splash img { width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 14px 34px rgba(3, 40, 30, .45) }
#splash b { font: 600 30px/1.1 var(--sans); letter-spacing: -.02em }
#splash span { font-size: 15px; opacity: .85; max-width: 260px }
@media (prefers-reduced-motion: reduce) { #splash { transition: none } }
</style>
</head>
<body>
<div id="splash" aria-hidden="true"><img src="icon-192.png" alt="" width="112" height="112"><b>Gig Kasboek</b><span>Your invoices, VAT and hours in one place</span></div>
<script>
/* Skip the opening screen when coming back from Google's sign-in, so that return feels instant. */
if (/(^|[#&])(access_token|error)=/.test(location.hash)) document.getElementById('splash').remove();
</script>
<div class="wrap">
  <header class="top">
    <h1>Gig Kasboek</h1>
    <div class="sync"><span id="syncText"></span><button class="linkbtn" id="syncBtn" type="button" hidden>Check email</button></div>
  </header>
  <div class="qnav" id="qnav">
    <button type="button" id="qPrev" aria-label="Previous quarter">&#8249;</button>
    <div class="q"><b id="qLabel"></b><span id="qSub"></span></div>
    <button type="button" id="qNext" aria-label="Next quarter">&#8250;</button>
  </div>
  <div id="notice" class="notice" hidden></div>
  <main id="view" style="display:flex;flex-direction:column;gap:14px"></main>
  <form class="sheet" id="exForm" hidden novalidate>
    <div class="eyebrow">New expense</div>
    <div class="field"><label for="exWhat">What was it</label><input id="exWhat" autocomplete="off" placeholder="Work shoes, train ticket"></div>
    <div class="field"><label for="exNote">Who or what it was for (optional)</label><input id="exNote" autocomplete="off" placeholder="Dinner with the crew after the event"></div>
    <div class="two">
      <div class="field"><label for="exDate">Date on the receipt</label><input id="exDate" type="date"></div>
      <div class="field"><label for="exAmount">Paid, incl. VAT (&euro;)</label><input id="exAmount" inputmode="decimal" autocomplete="off" placeholder="0,00"></div>
    </div>
    <div class="two">
      <div class="field"><label for="exRate">VAT on it</label><select id="exRate"><option value="21">21%</option><option value="9">9%</option><option value="0">No VAT</option><option value="custom">Type the amount</option></select></div>
      <div class="field"><label for="exVat">VAT amount (&euro;)</label><input id="exVat" inputmode="decimal" autocomplete="off" placeholder="0,00"></div>
    </div>
    <div class="field"><label for="exFile">Photo of the receipt, or a PDF (optional)</label><input id="exFile" type="file" accept="image/*,application/pdf"></div>
    <div class="err" id="exErr" hidden></div>
    <div class="actions"><button class="btn primary" type="submit" id="exSave">Save expense</button><button class="btn" type="button" id="exCancel">Cancel</button></div>
  </form>
</div>
<nav class="tabs"><div>
  <button type="button" data-tab="overview">Overview</button>
  <button type="button" data-tab="invoices">Invoices</button>
  <button type="button" data-tab="expenses">Expenses</button>
  <button type="button" data-tab="setup">Setup</button>
</div></nav>
<input id="rcFile" type="file" accept="image/*,application/pdf" hidden aria-label="Receipt file">
<input id="pdfFile" type="file" accept="application/pdf" multiple hidden aria-label="Invoice PDFs">
<input id="bkFile" type="file" accept=".zip,application/zip" hidden aria-label="Backup file">
<div class="toast" id="toast" hidden></div>

<script src="config.js"></script>
<script>
/*__PARSER__*/
</script>
<script>
(() => {
  const CFG = window.KASBOEK_CONFIG || {};
  const CLIENT = (CFG.googleClientId || '').trim();
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const r2 = n => Math.round(n * 100) / 100;
  const eur = n => new Intl.NumberFormat('en-GB', { style: 'currency', currency: 'EUR' }).format(n || 0);
  const hrs = n => (n || 0).toLocaleString('en-GB', { maximumFractionDigits: 2 }) + ' h';
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const pad = n => String(n).padStart(2, '0');
  const isoOf = d => `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`;
  const utc = iso => { const [y, m, d] = iso.split('-').map(Number); return Date.UTC(y, m - 1, d); };
  const days = (a, b) => Math.round((utc(b) - utc(a)) / 864e5);
  const nice = iso => { const [y, m, d] = iso.split('-').map(Number); return `${d} ${MON[m - 1]} ${y}`; };
  const short = iso => { const [, m, d] = iso.split('-').map(Number); return `${d} ${MON[m - 1]}`; };
  const today = () => { try { return new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Amsterdam' }).format(new Date()); } catch (e) { return isoOf(new Date()); } };
  const isDate = v => /^\d{4}-\d{2}-\d{2}$/.test(v || '');
  const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  const lsDel = k => { try { localStorage.removeItem(k); } catch (e) {} };
  const rid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const money = v => { const n = parseFloat(String(v).trim().replace(/\s/g, '').replace(',', '.')); return isFinite(n) ? r2(n) : NaN; };
  const ago = t => { const m = Math.round((Date.now() - t) / 60000); return m < 2 ? 'just now' : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} days ago`; };

  /* Dutch VAT quarters: the return for a quarter is filed and paid in the month after it ends. */
  const qOf = iso => { const [y, m] = iso.split('-').map(Number); return { y, q: Math.ceil(m / 3) }; };
  const qKey = ({ y, q }) => `${y}-Q${q}`;
  const qStart = ({ y, q }) => `${y}-${pad(q * 3 - 2)}-01`;
  const qEnd = ({ y, q }) => isoOf(new Date(Date.UTC(y, q * 3, 0)));
  const qOpen = ({ y, q }) => isoOf(new Date(Date.UTC(y, q * 3, 1)));
  const qDue = ({ y, q }) => isoOf(new Date(Date.UTC(y, q * 3 + 1, 0)));
  const qShift = ({ y, q }, n) => { const i = y * 4 + (q - 1) + n; return { y: Math.floor(i / 4), q: (i % 4) + 1 }; };
  const inQ = (iso, Q) => !!iso && iso >= qStart(Q) && iso <= qEnd(Q);

  /* ---------- storage: everything lives in this browser's IndexedDB ---------- */
  const DB = (() => {
    let p;
    const open = () => p || (p = new Promise((ok, no) => {
      const r = indexedDB.open('gig-kasboek', 1);
      r.onupgradeneeded = () => ['invoices', 'expenses', 'files', 'meta'].forEach(n => r.result.createObjectStore(n));
      r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error);
    }));
    const run = async (store, mode, fn) => { const d = await open(); return new Promise((ok, no) => { const t = d.transaction(store, mode); const q = fn(t.objectStore(store)); t.oncomplete = () => ok(q ? q.result : undefined); t.onerror = t.onabort = () => no(t.error); }); };
    return {
      all: async store => { const d = await open(); return new Promise((ok, no) => { const s = d.transaction(store).objectStore(store), k = s.getAllKeys(), v = s.getAll(); v.onsuccess = () => ok(v.result.map((val, i) => ({ key: k.result[i], value: val }))); v.onerror = () => no(v.error); }); },
      get: (store, key) => run(store, 'readonly', s => s.get(key)),
      put: (store, key, val) => run(store, 'readwrite', s => s.put(val, key)),
      del: (store, key) => run(store, 'readwrite', s => s.delete(key)),
      clear: store => run(store, 'readwrite', s => s.clear()),
    };
  })();
  const defaults = () => ({ senders: [], vatStart: null, hoursMark: null, filed: {}, gmail: null, lastCheck: null, seenMsgs: {}, ignored: {} });
  const state = {
    tab: ['overview', 'invoices', 'expenses', 'setup'].includes(lsGet('kb.tab')) ? lsGet('kb.tab') : 'overview',
    Q: qOf(today()), invoices: new Map(), expenses: new Map(), settings: defaults(), token: null,
    loaded: false, failed: false, open: null, invScope: 'q', confirmDel: null, busy: null, zoom: null, rcFor: null, editInv: null, wipe: false,
  };
  const saveSettings = () => DB.put('meta', 'settings', state.settings);
  async function loadAll() {
    const [inv, ex, set] = await Promise.all([DB.all('invoices'), DB.all('expenses'), DB.get('meta', 'settings')]);
    state.invoices = new Map(inv.map(r => [r.key, r.value])); state.expenses = new Map(ex.map(r => [r.key, r.value]));
    state.settings = Object.assign(defaults(), set || {});
  }
  const urls = new Map();
  async function fileBlob(id) { const f = await DB.get('files', id); return f ? new Blob([f.buf], { type: f.type }) : null; }
  async function fileUrl(id) { if (!urls.has(id)) { const b = await fileBlob(id); if (!b) return null; urls.set(id, URL.createObjectURL(b)); } return urls.get(id); }
  async function putFile(data, type, name) {
    const buf = data instanceof Blob ? await data.arrayBuffer() : data.buffer.slice(data.byteOffset, data.byteOffset + data.byteLength);
    const id = rid('f'); await DB.put('files', id, { buf, type, name }); return id;
  }
  async function dropFile(id) { if (!id) return; if (urls.has(id)) { URL.revokeObjectURL(urls.get(id)); urls.delete(id); } await DB.del('files', id); }
  async function saveBlob(blob, filename) {
    const file = new File([blob], filename, { type: blob.type });
    if (matchMedia('(pointer: coarse)').matches && navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  }
  async function openFile(id) {
    const u = await fileUrl(id); if (!u) { toast('That file is no longer on this device.'); return; }
    if (!window.open(u, '_blank')) { const a = document.createElement('a'); a.href = u; a.target = '_blank'; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove(); }
  }

  function toast(msg) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 3200); }
  function notice(msg, bad) { const n = $('notice'); n.hidden = !msg; n.textContent = msg || ''; n.className = 'notice' + (bad ? ' bad' : ''); }

  /* ---------- sums ---------- */
  const invList = () => [...state.invoices.values()].sort((a, b) => (b.issued || '').localeCompare(a.issued || '') || String(b.number).localeCompare(String(a.number)));
  const exList = () => [...state.expenses.values()].sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  function sums(Q) {
    const start = state.settings.vatStart, counts = d => !start || (d || '') >= start;
    const inv = invList().filter(i => inQ(i.issued, Q)), ex = exList().filter(e => inQ(e.date, Q));
    const earned = r2(inv.reduce((t, i) => t + (i.subtotal || 0), 0));
    const vatOut = r2(inv.reduce((t, i) => t + (counts(i.issued) ? i.vat || 0 : 0), 0));
    const hours = r2(inv.reduce((t, i) => t + (i.hours || 0), 0));
    const exGross = r2(ex.reduce((t, e) => t + (e.amount || 0), 0));
    const vatIn = r2(ex.reduce((t, e) => t + (counts(e.date) ? e.vat || 0 : 0), 0));
    return { inv, ex, earned, vatOut, hours, exGross, vatIn, exNet: r2(exGross - vatIn), vatDue: r2(vatOut - vatIn) };
  }
  function monthHours(Q) {
    const out = [0, 1, 2].map(k => ({ m: Q.q * 3 - 3 + k, h: 0 }));
    for (const i of state.invoices.values()) {
      const shifts = (i.lines || []).filter(l => l.kind === 'shift');
      if (shifts.length) { for (const l of shifts) if (inQ(l.date, Q)) out[Number(l.date.slice(5, 7)) - 1 - (Q.q * 3 - 3)].h += l.qty || 0; }
      else if (i.hours && inQ(i.issued, Q)) out[Number(i.issued.slice(5, 7)) - 1 - (Q.q * 3 - 3)].h += i.hours;
    }
    return out.map(o => ({ m: o.m, h: r2(o.h) }));
  }

  /* ---------- views ---------- */
  function deadlineCard(Q) {
    const t = today(), end = qEnd(Q), open = qOpen(Q), due = qDue(Q), key = qKey(Q), name = `Q${Q.q} ${Q.y}`, start = state.settings.vatStart;
    if (start && end < start) return `<section class="deadline quiet"><div class="eyebrow">VAT return ${name}</div><div class="count"><b>None</b><span>to file</span></div><p>Your VAT registration starts ${nice(start)}, so there is no return for this quarter.</p></section>`;
    if (state.settings.filed[key]) return `<section class="deadline done"><div class="eyebrow">VAT return ${name}</div><div class="count"><b>Filed</b></div><p>You marked this return as filed. It was due ${nice(due)}.</p><button class="ghost" type="button" data-act="unfile">Undo</button></section>`;
    if (t > due) return `<section class="deadline late"><div class="eyebrow">VAT return ${name}</div><div class="count"><b>${days(due, t)}</b><span>days past the deadline</span></div><p>This return was due ${nice(due)}.</p><button class="ghost" type="button" data-act="file">Mark as filed</button></section>`;
    const total = days(qStart(Q), due), pct = Math.max(0, Math.min(100, days(qStart(Q), t) / total * 100)), tick = days(qStart(Q), end) / total * 100;
    const text = t <= end ? `The quarter runs until ${nice(end)}. File and pay between ${short(open)} and ${nice(due)}.` : `Filing is open. File and pay by ${nice(due)}.`;
    return `<section class="deadline"><div class="eyebrow">VAT return ${name}</div><div class="count"><b>${days(t, due)}</b><span>days left to file and pay</span></div><p>${text}</p>
      <div><div class="track"><i style="width:${pct.toFixed(1)}%"></i><u style="left:${tick.toFixed(1)}%"></u></div><div class="track-labels"><span>${short(qStart(Q))}</span><span>quarter ends ${short(end)}</span><span>${short(due)}</span></div></div>
      ${t > end ? '<button class="ghost" type="button" data-act="file">Mark as filed</button>' : ''}</section>`;
  }
  function overview() {
    const Q = state.Q, s = sums(Q), mh = monthHours(Q), S = state.settings, mark = S.hoursMark > 0 ? S.hoursMark : 0;
    const cap = Math.max(mark * 1.25, 10, ...mh.map(m => m.h)) * 1.05, back = s.vatDue < 0;
    const start = !state.invoices.size ? `<section class="block"><h2>Start here</h2><ol class="steps"><li>Under Setup, add the email address your invoices come from.</li><li>${CLIENT ? 'Connect your Gmail there, or add invoice PDFs by hand under Invoices.' : 'Add your invoice PDFs under Invoices.'}</li></ol><button class="btn primary" type="button" data-act="gosetup">Open Setup</button></section>` : '';
    return start + deadlineCard(Q) + `
    <section class="block"><h2>${back ? 'VAT to get back' : 'VAT to pay'}</h2>
      <div class="big tax">${eur(Math.abs(s.vatDue))}</div>
      <div class="rows">
        <div><span>VAT on your invoices</span><span>${eur(s.vatOut)}</span></div>
        <div><span>VAT on your expenses</span><span>&minus; ${eur(s.vatIn)}</span></div>
      </div>
      <div class="small muted">Invoices count in the quarter of their invoice date, expenses in the quarter of their receipt date.${S.vatStart && S.vatStart > qStart(Q) ? ` VAT counts from ${nice(S.vatStart)}, when your registration started.` : ''}</div>
    </section>
    <section class="block"><h2>Earned this quarter</h2>
      <button class="big tapbig" type="button" data-act="earnings" aria-label="${eur(s.earned)} earned this quarter. Show all earnings">${eur(s.earned)}<i>All earnings &rsaquo;</i></button>
      <div class="small muted">Excluding VAT, from ${s.inv.length} invoice${s.inv.length === 1 ? '' : 's'}.</div>
      <div class="stats">
        <div><b>${hrs(s.hours)}</b><span>hours invoiced</span></div>
        <div><b>${s.hours ? eur(s.earned / s.hours) : '&ndash;'}</b><span>per hour</span></div>
        <div><b>${eur(r2(s.earned - s.exNet))}</b><span>after expenses</span></div>
      </div>
    </section>
    <section class="block"><h2>Hours by month worked</h2>
      <div class="months">${mh.map(m => `<div class="month"><span>${MON[m.m]}</span><div class="bar"><i class="${m.h ? '' : 'zero'}" style="width:${(m.h / cap * 100).toFixed(1)}%"></i>${mark ? `<u style="left:${(mark / cap * 100).toFixed(1)}%"></u>` : ''}</div><span class="v">${hrs(m.h)}</span></div>`).join('')}</div>
      <div class="small muted">Counted on the day of each shift where the invoice lists them.${mark ? ` The line marks ${mark} hours.` : ''}</div>
    </section>`;
  }
  /* Earnings by the day worked: each shift on its own date, extras on the date of the shift above them.
     Invoices without shift lines (other layouts, or numbers edited by hand) count on their invoice date. */
  function workEntries() {
    const out = [];
    for (const i of state.invoices.values()) {
      const lines = i.edited ? [] : (i.lines || []);
      if (!lines.length) { if (i.issued) out.push({ date: i.issued, amount: i.subtotal || 0, hours: i.hours || 0 }); continue; }
      let last = null;
      for (const l of lines) { if (l.kind === 'shift') last = l.date; out.push({ date: (l.kind === 'shift' ? l.date : last) || i.issued, amount: l.amount || 0, hours: l.kind === 'shift' ? l.qty || 0 : 0 }); }
    }
    return out;
  }
  function earnings() {
    const E = workEntries(), t = today(), back = '<button class="linkbtn back" type="button" data-act="back">&lsaquo; Back to overview</button>';
    if (!E.length) return back + '<div class="list"><div class="empty">No earnings yet. They appear here as soon as your first invoice is in.</div></div>';
    const tot = (a, b) => { let e = 0, h = 0; for (const x of E) if (x.date >= a && x.date <= b) { e += x.amount; h += x.hours; } return { e: r2(e), h: r2(h) }; };
    const addDays = (iso, n) => isoOf(new Date(utc(iso) + n * 864e5));
    const mEnd = (yy, mm) => isoOf(new Date(Date.UTC(yy, mm, 0)));
    const all = tot('0000', '9999'), first = E.reduce((m, x) => (x.date < m ? x.date : m), '9999');
    const mon = addDays(t, -((new Date(utc(t)).getUTCDay() + 6) % 7));
    const [y, m] = t.split('-').map(Number), pm = m === 1 ? { y: y - 1, m: 12 } : { y, m: m - 1 };
    const recent = [
      [`This week, ${short(mon)} to ${short(addDays(mon, 6))}`, tot(mon, addDays(mon, 6))],
      [`Last week, ${short(addDays(mon, -7))} to ${short(addDays(mon, -1))}`, tot(addDays(mon, -7), addDays(mon, -1))],
      [`${MON[m - 1]} ${y} so far`, tot(`${y}-${pad(m)}-01`, mEnd(y, m))],
      [`${MON[pm.m - 1]} ${pm.y}`, tot(`${pm.y}-${pad(pm.m)}-01`, mEnd(pm.y, pm.m))],
    ];
    const years = [...new Set(E.map(x => x.date.slice(0, 4)))].sort().reverse().map(yy => [yy, tot(`${yy}-01-01`, `${yy}-12-31`)]);
    const months = [];
    for (let k = 11; k >= 0; k--) {
      const d = new Date(Date.UTC(y, m - 1 - k, 1)), yy = d.getUTCFullYear(), mm = d.getUTCMonth() + 1;
      if (`${yy}-${pad(mm)}` >= first.slice(0, 7)) months.push({ label: `${MON[mm - 1]} ${String(yy).slice(2)}`, v: tot(`${yy}-${pad(mm)}-01`, mEnd(yy, mm)) });
    }
    const cap = Math.max(1, ...months.map(x => x.v.e)), n = state.invoices.size;
    const row = ([label, v]) => `<div><span>${esc(label)}${v.h ? ` <small class="muted">· ${hrs(v.h)}</small>` : ''}</span><span>${eur(v.e)}</span></div>`;
    return back + `
    <section class="block"><h2>Earned all time</h2>
      <div class="big">${eur(all.e)}</div>
      <div class="small muted">Excluding VAT, since ${nice(first)}.</div>
      <div class="stats">
        <div><b>${hrs(all.h)}</b><span>hours worked</span></div>
        <div><b>${all.h ? eur(all.e / all.h) : '&ndash;'}</b><span>per hour</span></div>

      let receipt = null, receiptType = null; const file = $('exFile').files && $('exFile').files[0];
      if (file) { receiptType = fileType(file); receipt = await putFile(file, receiptType, file.name); }
      const id = rid('e'), doc = { id, what, note: $('exNote').value.trim(), date, amount, vat, rate: $('exRate').value, receipt, receiptType, createdAt: new Date().toISOString() };
      await DB.put('expenses', id, doc); state.expenses.set(id, doc);
      $('exForm').hidden = true; state.Q = qOf(date); toast('Expense saved'); render();
    } catch (e) { $('exErr').textContent = 'Saving did not work. Your device may be out of storage.'; $('exErr').hidden = false; }
    $('exSave').disabled = false;
  }

  /* ---------- events ---------- */
  $('qPrev').onclick = () => { state.Q = qShift(state.Q, -1); state.open = null; render(); };
  $('qNext').onclick = () => { state.Q = qShift(state.Q, 1); state.open = null; render(); };
  $('syncBtn').onclick = () => { if (state.settings.gmail || state.settings.senders.length) syncEmail(); else { state.tab = 'setup'; render(); } };
  $('exForm').addEventListener('submit', saveExpense);
  $('exCancel').onclick = () => { $('exForm').hidden = true; render(); };
  $('exRate').onchange = autoVat; $('exAmount').oninput = autoVat;
  $('pdfFile').onchange = () => { const f = [...($('pdfFile').files || [])]; $('pdfFile').value = ''; if (f.length) addPdfs(f); };
  $('bkFile').onchange = () => { const f = $('bkFile').files && $('bkFile').files[0]; $('bkFile').value = ''; if (f) importBackup(f); };
  $('rcFile').onchange = async () => {
    const file = $('rcFile').files && $('rcFile').files[0], ex = state.expenses.get(state.rcFor); $('rcFile').value = '';
    if (!file || !ex) return;
    try { ex.receiptType = fileType(file); ex.receipt = await putFile(file, ex.receiptType, file.name); await DB.put('expenses', ex.id, ex); toast('Receipt attached'); } catch (e) { toast('The receipt could not be stored.'); }
    render();
  };
  document.querySelector('nav.tabs').addEventListener('click', e => { const b = e.target.closest('button[data-tab]'); if (!b) return; state.tab = b.dataset.tab; lsSet('kb.tab', state.tab); state.sub = null; state.wipe = false; notice(''); window.scrollTo(0, 0); render(); });
  $('view').addEventListener('click', async e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const act = b.dataset.act, id = b.dataset.id, S = state.settings, key = qKey(state.Q);
    try {
      if (act === 'toggle') { state.open = state.open === id ? null : id; state.editInv = null; state.confirmDel = null; }
      else if (act === 'scope') state.invScope = b.dataset.v;
      else if (act === 'earnings') { state.sub = 'earnings'; window.scrollTo(0, 0); }
      else if (act === 'back') { state.sub = null; window.scrollTo(0, 0); }
      else if (act === 'gosetup') { state.tab = 'setup'; lsSet('kb.tab', 'setup'); }
      else if (act === 'openpdf') return openFile(state.invoices.get(id).pdf);
      else if (act === 'savepdf') { const i = state.invoices.get(id), blob = await fileBlob(i.pdf); return blob ? saveBlob(blob, `Invoice_${i.id}.pdf`) : toast('That file is no longer on this device.'); }
      else if (act === 'merge') return mergePdfs();
      else if (act === 'addpdf') return $('pdfFile').click();
      else if (act === 'edit') state.editInv = id;
      else if (act === 'edcancel') state.editInv = null;
      else if (act === 'edsave') {
        const i = state.invoices.get(id), d = $('edDate').value, h = money($('edHours').value || '0'), sub = money($('edSub').value), vat = money($('edVat').value || '0');
        const err = !isDate(d) ? 'Pick the invoice date.' : !(sub >= 0) || !(vat >= 0) || !(h >= 0) ? 'Use numbers like 121,00.' : '';
        if (err) { $('edErr').textContent = err; $('edErr').hidden = false; return; }
        Object.assign(i, { issued: d, hours: h, subtotal: sub, vat, total: r2(sub + vat), check: false, edited: true });
        await DB.put('invoices', id, i); state.editInv = null; toast('Invoice updated');
      }
      else if (act === 'del') state.confirmDel = id;
      else if (act === 'delno') state.confirmDel = null;
      else if (act === 'invdelyes') { const i = state.invoices.get(id); if (i.srcKey) { S.ignored[i.srcKey] = 1; await saveSettings(); } await dropFile(i.pdf); await DB.del('invoices', id); state.invoices.delete(id); state.confirmDel = null; toast('Invoice deleted'); }
      else if (act === 'addex') return openForm();
      else if (act === 'zoom') state.zoom = state.zoom === id ? null : id;
      else if (act === 'openrc') return openFile(state.expenses.get(id).receipt);
      else if (act === 'addrc') { state.rcFor = id; return $('rcFile').click(); }
      else if (act === 'delyes') { const ex = state.expenses.get(id); await dropFile(ex.receipt); await DB.del('expenses', id); state.expenses.delete(id); state.confirmDel = null; toast('Expense deleted'); }
      else if (act === 'file' || act === 'unfile') { S.filed[key] = act === 'file'; await saveSettings(); }
      else if (act === 'addsender') {
        const v = $('sender').value.trim().toLowerCase();
        if (!/^[^\s@<>()"]+@[^\s@<>()"]+\.[a-z]{2,}$/.test(v)) { toast('That does not look like an email address.'); return; }
        if (!S.senders.includes(v)) { S.senders.push(v); S.seenMsgs = {}; await saveSettings(); }
      }
      else if (act === 'rmsender') { S.senders = S.senders.filter(a => a !== b.dataset.v); await saveSettings(); }
      else if (act === 'connect') return connect();
      else if (act === 'check') return syncEmail();
      else if (act === 'disconnect') return disconnect();
      else if (act === 'savevat') {
        const d = $('vatStart').value, m = $('hoursMark').value.trim();
        S.vatStart = isDate(d) ? d : null; S.hoursMark = m && Number(m) > 0 ? Number(m) : null; await saveSettings(); toast('Saved');
      }
      else if (act === 'export') return exportBackup();
      else if (act === 'import') return $('bkFile').click();
      else if (act === 'wipe') state.wipe = true;
      else if (act === 'wipeno') state.wipe = false;
      else if (act === 'wipeyes') { for (const s of ['invoices', 'expenses', 'files', 'meta']) await DB.clear(s); lsDel('kb.token'); state.token = null; urls.clear(); state.wipe = false; await loadAll(); state.tab = 'overview'; toast('Everything is deleted from this device'); }
      render();
    } catch (err) { toast('That did not save. Try again.'); render(); }
  });

  /* ---------- start ---------- */
  render();
  const born = Date.now();
  function closeSplash() {
    const s = $('splash'); if (!s) return;
    setTimeout(() => { s.classList.add('out'); setTimeout(() => s.remove(), 400); }, Math.max(0, 1100 - (Date.now() - born)));
  }
  (async () => {
    const back = takeRedirect();
    try { const t = JSON.parse(lsGet('kb.token') || 'null'); if (t && t.exp > Date.now()) state.token = t; } catch (e) {}
    try { await loadAll(); } catch (e) { state.failed = true; }
    state.loaded = true; render(); closeSplash();
    if (state.failed) return;
    if (back === 'failed') notice('Google did not give access, so nothing was connected.', true);
    const due = () => CLIENT && state.settings.gmail && tokenOk() && (!state.settings.lastCheck || Date.now() - state.settings.lastCheck > 600000);
    if (back === 'ok' || due()) syncEmail();
    document.addEventListener('visibilitychange', () => { if (!document.hidden) { header(); if (due()) syncEmail(); } });
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  })();
})();
</script>
</body>
</html>
