<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gig Kasboek</title>
<meta name="description" content="Freelance books on your phone: invoices from your email, VAT per quarter, hours, earnings and expenses. Everything stays on your device.">
<meta name="theme-color" content="#0E6B4E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
html { padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px) }
body { margin: 0 }
[hidden] { display: none !important }
/* Layout: one phone-width column. The VAT deadline and the amount to set aside lead, the records follow, tabs sit at the thumb. */
:root {
  --bg: #EDF0EB; --surface: #FAFBF9; --ink: #15211C; --muted: #5A6861; --line: #D3DAD3;
  --accent: #0E6B4E; --on-accent: #FFFFFF; --accent-soft: #DCEBE3;
  --tax: #9A4A12; --tax-soft: #F5E6D5; --late: #B3261E; --late-soft: #F8DEDB;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D1412; --surface: #151E1B; --ink: #E7EEEA; --muted: #93A29B; --line: #26332E;
  --accent: #4BC596; --on-accent: #06221A; --accent-soft: #173529;
  --tax: #E8A662; --tax-soft: #33261A; --late: #F2857C; --late-soft: #3A1D1B; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0D1412; --surface: #151E1B; --ink: #E7EEEA; --muted: #93A29B; --line: #26332E;
  --accent: #4BC596; --on-accent: #06221A; --accent-soft: #173529;
  --tax: #E8A662; --tax-soft: #33261A; --late: #F2857C; --late-soft: #3A1D1B; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.45 var(--sans); -webkit-text-size-adjust: 100% }
.wrap { max-width: 520px; margin: 0 auto; padding-block: 14px 96px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 14px }
button, input, select { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted) }
.muted { color: var(--muted) }
.small { font-size: 13px }

header.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px }
header.top h1 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -.01em }
.sync { display: flex; align-items: center; gap: 8px; min-width: 0 }
.sync span { font-size: 12px; color: var(--muted); text-align: right; min-width: 0 }
.linkbtn { background: none; border: 0; padding: 4px 0; color: var(--accent); font-weight: 500; font-size: 13px; white-space: nowrap }

.qnav { display: flex; align-items: center; justify-content: space-between; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px }
.qnav button { width: 44px; height: 40px; border: 0; background: none; border-radius: 9px; font-size: 20px; color: var(--ink) }
.qnav button:disabled { opacity: .25; cursor: default }
.qnav .q { text-align: center; line-height: 1.2 }
.qnav .q b { display: block; font-family: var(--mono); font-weight: 600; font-size: 16px }
.qnav .q span { font-size: 12px; color: var(--muted) }

.notice { border-radius: 10px; padding: 10px 12px; font-size: 13px; background: var(--tax-soft); color: var(--ink) }
.notice.bad { background: var(--late-soft) }

.deadline { background: var(--ink); color: var(--bg); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 10px }
.deadline .eyebrow { color: inherit; opacity: .7 }
.deadline .count { display: flex; align-items: baseline; gap: 8px }
.deadline .count b { font: 600 52px/1 var(--mono); letter-spacing: -.03em }
.deadline .count span { font-size: 16px; opacity: .85 }
.deadline p { margin: 0; font-size: 14px; opacity: .9 }
.deadline.late { background: var(--late); color: #fff }
.deadline.done { background: var(--accent); color: var(--on-accent) }
.deadline.quiet { background: var(--surface); color: var(--ink); border: 1px solid var(--line) }
.track { position: relative; height: 6px; border-radius: 3px; background: color-mix(in srgb, currentColor 22%, transparent); margin-top: 4px }
.track i { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: currentColor }
.track u { position: absolute; top: -4px; bottom: -4px; width: 2px; background: currentColor; opacity: .6 }
.track-labels { display: flex; justify-content: space-between; font: 11px var(--mono); opacity: .75 }
.deadline .ghost { align-self: flex-start; background: none; border: 1px solid currentColor; color: inherit; border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 500 }

.block { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px }
.block h2 { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted) }
.big { font: 600 34px/1.05 var(--mono); letter-spacing: -.02em; font-variant-numeric: tabular-nums }
.big.tax { color: var(--tax) }
.rows { display: flex; flex-direction: column }
.rows > div { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 14px }
.rows > div span:last-child { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap }
.rows > div.sum { font-weight: 600 }
.stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px }
.stats > div { min-width: 0 }
.stats b { display: block; font: 600 18px/1.2 var(--mono); font-variant-numeric: tabular-nums }
.stats span { font-size: 12px; color: var(--muted) }

.months { display: flex; flex-direction: column; gap: 10px }
.month { display: grid; grid-template-columns: 34px 1fr 62px; align-items: center; gap: 10px; font-size: 13px }
.month .bar { position: relative; height: 14px; background: var(--bg); border-radius: 4px }
.month .bar i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 4px; min-width: 2px }
.month .bar i.zero { background: none }
.month .bar u { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink) }
.month .v { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums }

.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px }
.seg button { border: 0; background: none; border-radius: 7px; padding: 8px; font-size: 13px; font-weight: 500; color: var(--muted) }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg) }

.list { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden }
.item + .item { border-top: 1px solid var(--line) }
.item > button.head { width: 100%; text-align: left; background: none; border: 0; padding: 13px 16px; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px }
.item .t { font-weight: 500; min-width: 0; overflow-wrap: anywhere }
.item .a { font-family: var(--mono); font-weight: 600; font-variant-numeric: tabular-nums; text-align: right }
.item .s { font-size: 12.5px; color: var(--muted); min-width: 0; overflow-wrap: anywhere }
.item .s2 { font-size: 12.5px; color: var(--muted); text-align: right; font-family: var(--mono) }
.chip { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--tax-soft); color: var(--tax); vertical-align: 1px }
.chip.plain { background: var(--bg); color: var(--muted) }
.chip.bad { background: var(--late-soft); color: var(--late) }
.detail { padding: 0 16px 14px; display: flex; flex-direction: column; gap: 10px }
.shift { display: grid; grid-template-columns: 1fr auto; gap: 0 12px; font-size: 13px; padding-top: 8px; border-top: 1px dashed var(--line) }
.shift .w { min-width: 0; overflow-wrap: anywhere }
.shift .m { font-family: var(--mono); text-align: right; white-space: nowrap }
.shift .d { grid-column: 1 / -1; color: var(--muted); font-size: 12.5px }
.actions { display: flex; flex-wrap: wrap; gap: 8px }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 14px; font-weight: 500; text-decoration: none }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent) }
.btn.danger { color: var(--late); border-color: var(--late) }
.btn.wide { width: 100% }
.btn:disabled { opacity: .5; cursor: default }
.thumb { padding: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--bg); width: 72px; height: 72px; flex: none }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block }
.receipt-full { width: 100%; border-radius: 10px; border: 1px solid var(--line); display: block }
.empty { padding: 22px 16px; text-align: center; color: var(--muted); font-size: 14px }

form.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0 }
.field label { font-size: 12px; font-weight: 600; color: var(--muted) }
.field input, .field select { width: 100%; min-height: 42px; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); font-size: 16px }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.err { color: var(--late); font-size: 13px }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); z-index: 5 }
nav.tabs div { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px }
nav.tabs button { border: 0; background: none; border-radius: 10px; padding: 10px 4px; font-size: 13px; font-weight: 500; color: var(--muted) }
nav.tabs button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600 }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(78px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 999px; font-size: 13px; z-index: 6; max-width: calc(100% - 32px) }
nav.tabs div { grid-template-columns: repeat(4, 1fr) }
.block p { margin: 0 }
.chips { display: flex; flex-wrap: wrap; gap: 8px }
.chips button { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 6px 12px; font-size: 13px; max-width: 100%; overflow-wrap: anywhere; text-align: left }
.chips button b { color: var(--late); font-weight: 600; margin-left: 6px }
.inline { display: flex; gap: 8px }
.inline input { flex: 1; min-width: 0; min-height: 42px; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); font-size: 16px }
.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 14px }
#view { display: flex; flex-direction: column; gap: 14px }
nav.tabs .brand, header.top h1 .d { display: none }
@media (hover: hover) {
  .btn:hover:not(:disabled), .chips button:hover { border-color: var(--muted) }
  nav.tabs button:hover { color: var(--ink) }
  .item > button.head:hover { background: color-mix(in srgb, var(--ink) 4%, transparent) }
}
/* Computer screens: the tab bar becomes a sidebar and the cards sit side by side. Same page, same data. */
@media (min-width: 900px) {
  nav.tabs { top: 0; right: auto; width: 232px; border-top: 0; border-right: 1px solid var(--line); padding: 24px 14px; display: flex; flex-direction: column; gap: 26px }
  nav.tabs .brand { display: flex; align-items: center; gap: 12px; padding: 0 8px; font-weight: 600; font-size: 17px; letter-spacing: -.01em }
  nav.tabs .brand img { width: 38px; height: 38px; border-radius: 9px }
  nav.tabs div { max-width: none; margin: 0; display: flex; flex-direction: column; gap: 4px }
  nav.tabs button { text-align: left; padding: 11px 14px; font-size: 15px }
  .wrap { max-width: 1180px; margin: 0 0 0 232px; padding: 30px 40px 56px; gap: 18px }
  header.top h1 { font-size: 26px }
  header.top h1 .m { display: none }
  header.top h1 .d { display: inline }
  .qnav { width: 320px }
  .notice, form.sheet { max-width: 640px }
  #view.v-overview, #view.v-earnings, #view.v-setup { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px }
  #view .span, #view.v-setup > p, #view.v-earnings > .back { grid-column: 1 / -1 }
  #view.v-earnings > .back { justify-self: start }
  #view.v-invoices, #view.v-expenses { max-width: 900px }
  .seg { max-width: 360px }
  .btn.wide { width: auto; align-self: flex-start }
  .block { padding: 20px }
  .deadline { padding: 22px }
  .item > button.head { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1.6fr) 84px 116px; grid-template-areas: "t s h a"; align-items: center; gap: 18px; padding: 14px 20px }
  .item > button.head .t { grid-area: t } .item > button.head .s { grid-area: s } .item > button.head .s2 { grid-area: h } .item > button.head .a { grid-area: a }
  .detail { padding: 0 20px 18px; max-width: 640px }
  .toast { left: calc(50% + 116px); bottom: 28px }
}
.box { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 2px 12px; padding: 11px 0; border-top: 1px solid var(--line); align-items: baseline }
.box .n { font: 600 15px var(--mono); color: var(--tax) }
.box .l small { display: block; color: var(--muted); font-size: 12.5px }
.box .v { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; font-weight: 600 }
.box .v small { display: block; font-weight: 400; color: var(--muted); font-size: 12px }
.box.total { border-top: 2px solid var(--ink) }
@media (min-width: 900px) { #view.v-vatreturn { max-width: 760px } }
.tapbig { background: none; border: 0; padding: 0; text-align: left; display: flex; align-items: baseline; gap: 10px; width: 100% }
.tapbig i { font: 500 13px var(--sans); font-style: normal; color: var(--accent); letter-spacing: 0; white-space: nowrap }
.month.wide { grid-template-columns: 52px 1fr 88px }
.back { align-self: flex-start; font-size: 14px }
/* Opening screen: brand green in both themes, shown for a moment on a cold start. */
#splash { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px;
  background: radial-gradient(120% 80% at 50% 38%, #0E5741, #04211A); color: #FCFDFA; text-align: center; transition: opacity .35s ease }
#splash.out { opacity: 0; pointer-events: none }
#splash img { width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 14px 34px rgba(3, 40, 30, .45) }
#splash b { font: 600 30px/1.1 var(--sans); letter-spacing: -.02em }
#splash span { font-size: 15px; opacity: .85; max-width: 260px }
@media (prefers-reduced-motion: reduce) { #splash { transition: none } }
</style>
</head>
<body>
<div id="splash" aria-hidden="true"><img src="icon-192.png" alt="" width="112" height="112"><b>Gig Kasboek</b><span>Your invoices, VAT and hours in one place</span></div>
<script>
/* Skip the opening screen when coming back from Google's sign-in, so that return feels instant. */
if (/(^|[#&])(access_token|error)=/.test(location.hash)) document.getElementById('splash').remove();
</script>
<div class="wrap">
  <header class="top">
    <h1><span class="m">Gig Kasboek</span><span class="d" id="pageTitle"></span></h1>
    <div class="sync"><span id="syncText"></span><button class="linkbtn" id="syncBtn" type="button" hidden>Check email</button></div>
  </header>
  <div class="qnav" id="qnav">
    <button type="button" id="qPrev" aria-label="Previous quarter">&#8249;</button>
    <div class="q"><b id="qLabel"></b><span id="qSub"></span></div>
    <button type="button" id="qNext" aria-label="Next quarter">&#8250;</button>
  </div>
  <div id="notice" class="notice" hidden></div>
  <main id="view"></main>
  <form class="sheet" id="exForm" hidden novalidate>
    <div class="eyebrow">New expense</div>
    <div class="field"><label for="exWhat">What was it</label><input id="exWhat" autocomplete="off" placeholder="Work shoes, train ticket"></div>
    <div class="field"><label for="exNote">Who or what it was for (optional)</label><input id="exNote" autocomplete="off" placeholder="Dinner with the crew after the event"></div>
    <div class="two">
      <div class="field"><label for="exDate">Date on the receipt</label><input id="exDate" type="date"></div>
      <div class="field"><label for="exAmount">Paid, incl. VAT (&euro;)</label><input id="exAmount" inputmode="decimal" autocomplete="off" placeholder="0,00"></div>
    </div>
    <div class="two">
      <div class="field"><label for="exRate">VAT on it</label><select id="exRate"><option value="21">21%</option><option value="9">9%</option><option value="0">No VAT</option><option value="custom">Type the amount</option></select></div>
      <div class="field"><label for="exVat">VAT amount (&euro;)</label><input id="exVat" inputmode="decimal" autocomplete="off" placeholder="0,00"></div>
    </div>
    <div class="field"><label for="exFile">Photo of the receipt, or a PDF (optional)</label><input id="exFile" type="file" accept="image/*,application/pdf"></div>
    <div class="err" id="exErr" hidden></div>
    <div class="actions"><button class="btn primary" type="submit" id="exSave">Save expense</button><button class="btn" type="button" id="exCancel">Cancel</button></div>
  </form>
</div>
<nav class="tabs"><span class="brand"><img src="icon-192.png" alt="" width="38" height="38">Gig Kasboek</span><div>
  <button type="button" data-tab="overview">Overview</button>
  <button type="button" data-tab="invoices">Invoices</button>
  <button type="button" data-tab="expenses">Expenses</button>
  <button type="button" data-tab="setup">Setup</button>
</div></nav>
<input id="rcFile" type="file" accept="image/*,application/pdf" hidden aria-label="Receipt file">
<input id="pdfFile" type="file" accept="application/pdf" multiple hidden aria-label="Invoice PDFs">
<input id="bkFile" type="file" accept=".zip,application/zip" hidden aria-label="Backup file">
<div class="toast" id="toast" hidden></div>

<script src="config.js"></script>
<script>
/* Invoice reading: Gmail raw message -> PDF bytes -> text -> numbers. Pure functions, no page state. */
const Inv = (() => {
  const num = s => parseFloat(String(s).replace(/\./g, '').replace(',', '.'));
  const r2 = n => Math.round(n * 100) / 100;
  function b64ToBytes(b64) {
    const bin = atob(b64.replace(/-/g, '+').replace(/_/g, '/').replace(/[^A-Za-z0-9+/=]/g, ''));
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function pdfFromRaw(raw) {
    const bytes = b64ToBytes(raw);
    let s = '';
    for (let i = 0; i < bytes.length; i += 8192) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
    const m = /Content-(?:Type:\s*application\/pdf|Disposition:[^\r\n]*\.pdf)[\s\S]*?\r?\n\r?\n([A-Za-z0-9+\/=\r\n]+)/i.exec(s);
    if (!m) return null;
    const pdf = b64ToBytes(m[1]);
    return pdf.length > 4 && pdf[0] === 0x25 && pdf[1] === 0x50 ? pdf : null;
  }
  async function pdfText(bytes, pdfjsLib) {
    const doc = await pdfjsLib.getDocument({ data: bytes.slice() }).promise;
    const out = [];
    for (let p = 1; p <= doc.numPages; p++) {
      const tc = await (await doc.getPage(p)).getTextContent();
      out.push(tc.items.map(i => i.str).join('\n'));
    }
    return out.join('\n');
  }
  function parse(text) {
    const flat = text.replace(/\s+/g, ' ').trim();
    const number = (/Factuurnummer:\s*([\d-]+)/.exec(flat) || [])[1] || null;
    const d = /Uitgiftedatum:\s*(\d{2})-(\d{2})-(\d{4})/.exec(flat);
    const issued = d ? `${d[3]}-${d[2]}-${d[1]}` : null;
    const a = flat.indexOf('Bedrag ');
    const b = flat.indexOf('IBAN nummer');
    let sec = a >= 0 && b > a ? flat.slice(a + 7, b) : '';
    sec = sec.replace(/Beschrijving Aantal Eenheidsprijs Belasting Bedrag/g, ' ').replace(/Pagina \d+ van \d+/g, ' ').replace(/\s+/g, ' ').trim();
    const lines = [];
    const re = /(.*?) (\d+(?:[.,]\d+)?) € ([\d.,]+) (?:(\d+) ?% )?€ ([\d.,]+)(?= |$)/g;
    let m, venue = '';
    while ((m = re.exec(sec))) {
      const desc = m[1].trim();
      const base = { qty: num(m[2]), rate: num(m[3]), vatRate: m[4] ? Number(m[4]) : 0, amount: num(m[5]) };
      const s = /^(.*?)\s*(\d{2})-(\d{2})-(\d{4}), (\d{2}:\d{2})u - (\d{2}:\d{2})u,?\s*(.*?)\s*(?:\d+ ?%)?$/.exec(desc);
      if (s) {
        if (s[1].trim()) venue = s[1].trim();
        lines.push({ kind: 'shift', venue, date: `${s[4]}-${s[3]}-${s[2]}`, start: s[5], end: s[6], what: s[7].trim(), ...base });
      } else {
        lines.push({ kind: 'extra', venue, what: desc, ...base });
      }
    }
    const hours = r2(lines.filter(l => l.kind === 'shift').reduce((t, l) => t + l.qty, 0));
    const subtotal = r2(lines.reduce((t, l) => t + l.amount, 0));
    const tm = /openstaande bedrag van € ([\d.,]+)/.exec(flat);
    const total = tm ? num(tm[1]) : subtotal;
    const vat = r2(total - subtotal);
    const expectVat = r2(lines.reduce((t, l) => t + l.amount * l.vatRate / 100, 0));
    let check = !number || !issued || !lines.length || !tm || vat < -0.005 || Math.abs(vat - expectVat) > 0.05;
    const blk = /Te betalen bedrag: ([\d.,]+) € ([\d.,]+)/.exec(flat);
    if (blk && (Math.abs(num(blk[1]) - hours) > 0.02 || Math.abs(num(blk[2]) - subtotal) > 0.02)) check = true;
    return { number, issued, hours, subtotal, vat, total, lines, check };
  }
  /* Best-effort reading of invoices in other layouts. Always flagged so the owner checks the numbers. */
  function generic(text) {
    const flat = text.replace(/\s+/g, ' ').trim();
    const amt = v => /,\d{1,2}$/.test(v) ? num(v) : parseFloat(v.replace(/,/g, ''));
    const A = '(\d[\d.,]*\d|\d)';
    const last = re => { const r = new RegExp(re, 'gi'); let m, out = null; while ((m = r.exec(flat))) out = m; return out; };
    const two = v => String(v).padStart(2, '0');
    const n = /(?:factuurnummer|factuurnr\.?|invoice (?:number|no\.?|#)|factuur)\s*[:#]?\s*([A-Z0-9][A-Z0-9\-\/._]{2,})/i.exec(flat);
    const d = /(?:factuurdatum|uitgiftedatum|invoice date|datum|date)\s*:?\s*(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/i.exec(flat) || /(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/.exec(flat);
    const tot = last('(?:totaal(?: te betalen)?|te betalen(?: bedrag)?|total(?: due)?|amount due|factuurbedrag)\s*:?\s*(?:incl\.? ?btw)?\s*(?:EUR|€)?\s*' + A);
    const vt = last('(?:btw|vat)(?: bedrag)?\s*(?:\(?\d{1,2}(?:[.,]\d)? ?%\)?)?\s*:?\s*(?:EUR|€)\s*' + A);
    const total = tot ? amt(tot[1]) || 0 : 0;
    let vat = vt ? amt(vt[1]) || 0 : 0; if (vat > total) vat = 0;
    return { number: n ? n[1] : null, issued: d ? `${d[3]}-${two(d[2])}-${two(d[1])}` : null, hours: 0, subtotal: r2(total - vat), vat: r2(vat), total: r2(total), lines: [], check: true };
  }
  return { pdfFromRaw, pdfText, parse, generic, b64ToBytes, r2 };
})();

<script>
(() => {
  const CFG = window.KASBOEK_CONFIG || {};
  const CLIENT = (CFG.googleClientId || '').trim();
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const r2 = n => Math.round(n * 100) / 100;
  const eur = n => new Intl.NumberFormat('en-GB', { style: 'currency', currency: 'EUR' }).format(n || 0);
  const hrs = n => (n || 0).toLocaleString('en-GB', { maximumFractionDigits: 2 }) + ' h';
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const pad = n => String(n).padStart(2, '0');
  const isoOf = d => `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`;
  const utc = iso => { const [y, m, d] = iso.split('-').map(Number); return Date.UTC(y, m - 1, d); };
  const days = (a, b) => Math.round((utc(b) - utc(a)) / 864e5);
  const nice = iso => { const [y, m, d] = iso.split('-').map(Number); return `${d} ${MON[m - 1]} ${y}`; };
  const short = iso => { const [, m, d] = iso.split('-').map(Number); return `${d} ${MON[m - 1]}`; };
  const today = () => { try { return new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Amsterdam' }).format(new Date()); } catch (e) { return isoOf(new Date()); } };
  const isDate = v => /^\d{4}-\d{2}-\d{2}$/.test(v || '');
  const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  const lsDel = k => { try { localStorage.removeItem(k); } catch (e) {} };
  const rid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const money = v => { const n = parseFloat(String(v).trim().replace(/\s/g, '').replace(',', '.')); return isFinite(n) ? r2(n) : NaN; };
  const ago = t => { const m = Math.round((Date.now() - t) / 60000); return m < 2 ? 'just now' : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} days ago`; };

  /* Dutch VAT quarters: the return for a quarter is filed and paid in the month after it ends. */
  const qOf = iso => { const [y, m] = iso.split('-').map(Number); return { y, q: Math.ceil(m / 3) }; };
  const qKey = ({ y, q }) => `${y}-Q${q}`;
  const qStart = ({ y, q }) => `${y}-${pad(q * 3 - 2)}-01`;
  const qEnd = ({ y, q }) => isoOf(new Date(Date.UTC(y, q * 3, 0)));
  const qOpen = ({ y, q }) => isoOf(new Date(Date.UTC(y, q * 3, 1)));
  const qDue = ({ y, q }) => isoOf(new Date(Date.UTC(y, q * 3 + 1, 0)));
  const qShift = ({ y, q }, n) => { const i = y * 4 + (q - 1) + n; return { y: Math.floor(i / 4), q: (i % 4) + 1 }; };
  const inQ = (iso, Q) => !!iso && iso >= qStart(Q) && iso <= qEnd(Q);

  /* ---------- storage: everything lives in this browser's IndexedDB ---------- */
  const DB = (() => {
    let p;
    const open = () => p || (p = new Promise((ok, no) => {
      const r = indexedDB.open('gig-kasboek', 1);
      r.onupgradeneeded = () => ['invoices', 'expenses', 'files', 'meta'].forEach(n => r.result.createObjectStore(n));
      r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error);
    }));
    const run = async (store, mode, fn) => { const d = await open(); return new Promise((ok, no) => { const t = d.transaction(store, mode); const q = fn(t.objectStore(store)); t.oncomplete = () => ok(q ? q.result : undefined); t.onerror = t.onabort = () => no(t.error); }); };
    return {
      all: async store => { const d = await open(); return new Promise((ok, no) => { const s = d.transaction(store).objectStore(store), k = s.getAllKeys(), v = s.getAll(); v.onsuccess = () => ok(v.result.map((val, i) => ({ key: k.result[i], value: val }))); v.onerror = () => no(v.error); }); },
      get: (store, key) => run(store, 'readonly', s => s.get(key)),
      put: (store, key, val) => run(store, 'readwrite', s => s.put(val, key)),
      del: (store, key) => run(store, 'readwrite', s => s.delete(key)),
      clear: store => run(store, 'readwrite', s => s.clear()),
    };
  })();
  const defaults = () => ({ senders: [], vatStart: null, hoursMark: null, filed: {}, gmail: null, lastCheck: null, seenMsgs: {}, ignored: {} });
  const state = {
    tab: ['overview', 'invoices', 'expenses', 'setup'].includes(lsGet('kb.tab')) ? lsGet('kb.tab') : 'overview',
    Q: qOf(today()), invoices: new Map(), expenses: new Map(), settings: defaults(), token: null,
    loaded: false, failed: false, open: null, invScope: 'q', confirmDel: null, busy: null, zoom: null, rcFor: null, editInv: null, wipe: false,
  };
  const saveSettings = () => DB.put('meta', 'settings', state.settings);
  async function loadAll() {
    const [inv, ex, set] = await Promise.all([DB.all('invoices'), DB.all('expenses'), DB.get('meta', 'settings')]);
    state.invoices = new Map(inv.map(r => [r.key, r.value])); state.expenses = new Map(ex.map(r => [r.key, r.value]));
    state.settings = Object.assign(defaults(), set || {});
  }
  const urls = new Map();
  async function fileBlob(id) { const f = await DB.get('files', id); return f ? new Blob([f.buf], { type: f.type }) : null; }
  async function fileUrl(id) { if (!urls.has(id)) { const b = await fileBlob(id); if (!b) return null; urls.set(id, URL.createObjectURL(b)); } return urls.get(id); }
  async function putFile(data, type, name) {
    const buf = data instanceof Blob ? await data.arrayBuffer() : data.buffer.slice(data.byteOffset, data.byteOffset + data.byteLength);
    const id = rid('f'); await DB.put('files', id, { buf, type, name }); return id;
  }
  async function dropFile(id) { if (!id) return; if (urls.has(id)) { URL.revokeObjectURL(urls.get(id)); urls.delete(id); } await DB.del('files', id); }
  async function saveBlob(blob, filename) {
    const file = new File([blob], filename, { type: blob.type });
    if (matchMedia('(pointer: coarse)').matches && navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  }
  async function openFile(id) {
    const u = await fileUrl(id); if (!u) { toast('That file is no longer on this device.'); return; }
    if (!window.open(u, '_blank')) { const a = document.createElement('a'); a.href = u; a.target = '_blank'; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove(); }
  }

  function toast(msg) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 3200); }
  function notice(msg, bad) { const n = $('notice'); n.hidden = !msg; n.textContent = msg || ''; n.className = 'notice' + (bad ? ' bad' : ''); }

  /* ---------- sums ---------- */
  const invList = () => [...state.invoices.values()].sort((a, b) => (b.issued || '').localeCompare(a.issued || '') || String(b.number).localeCompare(String(a.number)));
  const exList = () => [...state.expenses.values()].sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  function sums(Q) {
    const start = state.settings.vatStart, counts = d => !start || (d || '') >= start;
    const inv = invList().filter(i => inQ(i.issued, Q)), ex = exList().filter(e => inQ(e.date, Q));
    const earned = r2(inv.reduce((t, i) => t + (i.subtotal || 0), 0));
    const vatOut = r2(inv.reduce((t, i) => t + (counts(i.issued) ? i.vat || 0 : 0), 0));
    const hours = r2(inv.reduce((t, i) => t + (i.hours || 0), 0));
    const exGross = r2(ex.reduce((t, e) => t + (e.amount || 0), 0));
    const vatIn = r2(ex.reduce((t, e) => t + (counts(e.date) ? e.vat || 0 : 0), 0));
    return { inv, ex, earned, vatOut, hours, exGross, vatIn, exNet: r2(exGross - vatIn), vatDue: r2(vatOut - vatIn) };
  }
  function monthHours(Q) {
    const out = [0, 1, 2].map(k => ({ m: Q.q * 3 - 3 + k, h: 0 }));
    for (const i of state.invoices.values()) {
      const shifts = (i.lines || []).filter(l => l.kind === 'shift');
      if (shifts.length) { for (const l of shifts) if (inQ(l.date, Q)) out[Number(l.date.slice(5, 7)) - 1 - (Q.q * 3 - 3)].h += l.qty || 0; }
      else if (i.hours && inQ(i.issued, Q)) out[Number(i.issued.slice(5, 7)) - 1 - (Q.q * 3 - 3)].h += i.hours;
    }
    return out.map(o => ({ m: o.m, h: r2(o.h) }));
  }

  /* ---------- views ---------- */
  function deadlineCard(Q) {
    const t = today(), end = qEnd(Q), open = qOpen(Q), due = qDue(Q), key = qKey(Q), name = `Q${Q.q} ${Q.y}`, start = state.settings.vatStart;
    if (start && end < start) return `<section class="deadline quiet"><div class="eyebrow">VAT return ${name}</div><div class="count"><b>None</b><span>to file</span></div><p>Your VAT registration starts ${nice(start)}, so there is no return for this quarter.</p></section>`;
    if (state.settings.filed[key]) return `<section class="deadline done"><div class="eyebrow">VAT return ${name}</div><div class="count"><b>Filed</b></div><p>You marked this return as filed. It was due ${nice(due)}.</p><button class="ghost" type="button" data-act="unfile">Undo</button></section>`;
    if (t > due) return `<section class="deadline late"><div class="eyebrow">VAT return ${name}</div><div class="count"><b>${days(due, t)}</b><span>days past the deadline</span></div><p>This return was due ${nice(due)}.</p><button class="ghost" type="button" data-act="file">Mark as filed</button></section>`;
    const total = days(qStart(Q), due), pct = Math.max(0, Math.min(100, days(qStart(Q), t) / total * 100)), tick = days(qStart(Q), end) / total * 100;
    const text = t <= end ? `The quarter runs until ${nice(end)}. File and pay between ${short(open)} and ${nice(due)}.` : `Filing is open. File and pay by ${nice(due)}.`;
    return `<section class="deadline"><div class="eyebrow">VAT return ${name}</div><div class="count"><b>${days(t, due)}</b><span>days left to file and pay</span></div><p>${text}</p>
      <div><div class="track"><i style="width:${pct.toFixed(1)}%"></i><u style="left:${tick.toFixed(1)}%"></u></div><div class="track-labels"><span>${short(qStart(Q))}</span><span>quarter ends ${short(end)}</span><span>${short(due)}</span></div></div>
      ${t > end ? '<button class="ghost" type="button" data-act="file">Mark as filed</button>' : ''}</section>`;
  }
  function overview() {
    const Q = state.Q, s = sums(Q), mh = monthHours(Q), S = state.settings, mark = S.hoursMark > 0 ? S.hoursMark : 0;
    const cap = Math.max(mark * 1.25, 10, ...mh.map(m => m.h)) * 1.05, back = s.vatDue < 0;
    const start = !state.invoices.size ? `<section class="block span"><h2>Start here</h2><ol class="steps"><li>Under Setup, add the email address your invoices come from.</li><li>${CLIENT ? 'Connect your Gmail there, or add invoice PDFs by hand under Invoices.' : 'Add your invoice PDFs under Invoices.'}</li></ol><button class="btn primary" type="button" data-act="gosetup">Open Setup</button></section>` : '';
    return start + deadlineCard(Q) + `
    <section class="block"><h2>${back ? 'VAT to get back' : 'VAT to pay'}</h2>
      <div class="big tax">${eur(Math.abs(s.vatDue))}</div>
      <div class="rows">
        <div><span>VAT on your invoices</span><span>${eur(s.vatOut)}</span></div>
        <div><span>VAT on your expenses</span><span>&minus; ${eur(s.vatIn)}</span></div>
      </div>
      <div class="small muted">Invoices count in the quarter of their invoice date, expenses in the quarter of their receipt date.${S.vatStart && S.vatStart > qStart(Q) ? ` VAT counts from ${nice(S.vatStart)}, when your registration started.` : ''}</div>
      ${S.vatStart && qEnd(Q) < S.vatStart ? '' : '<div class="actions"><button class="btn" type="button" data-act="vatreturn">Numbers for the return &rsaquo;</button></div>'}
    </section>
    <section class="block"><h2>Earned this quarter</h2>
      <button class="big tapbig" type="button" data-act="earnings" aria-label="${eur(s.earned)} earned this quarter. Show all earnings">${eur(s.earned)}<i>All earnings &rsaquo;</i></button>
      <div class="small muted">Excluding VAT, from ${s.inv.length} invoice${s.inv.length === 1 ? '' : 's'}.</div>
      <div class="stats">
        <div><b>${hrs(s.hours)}</b><span>hours invoiced</span></div>
        <div><b>${s.hours ? eur(s.earned / s.hours) : '&ndash;'}</b><span>per hour</span></div>
        <div><b>${eur(r2(s.earned - s.exNet))}</b><span>after expenses</span></div>
      </div>
    </section>
    <section class="block"><h2>Hours by month worked</h2>
      <div class="months">${mh.map(m => `<div class="month"><span>${MON[m.m]}</span><div class="bar"><i class="${m.h ? '' : 'zero'}" style="width:${(m.h / cap * 100).toFixed(1)}%"></i>${mark ? `<u style="left:${(mark / cap * 100).toFixed(1)}%"></u>` : ''}</div><span class="v">${hrs(m.h)}</span></div>`).join('')}</div>
      <div class="small muted">Counted on the day of each shift where the invoice lists them.${mark ? ` The line marks ${mark} hours.` : ''}</div>
    </section>`;
  }
  /* Earnings by the day worked: each shift on its own date, extras on the date of the shift above them.
     Invoices without shift lines (other layouts, or numbers edited by hand) count on their invoice date. */
  function workEntries() {
    const out = [];
    for (const i of state.invoices.values()) {
      const lines = i.edited ? [] : (i.lines || []);
      if (!lines.length) { if (i.issued) out.push({ date: i.issued, amount: i.subtotal || 0, hours: i.hours || 0 }); continue; }
      let last = null;
      for (const l of lines) { if (l.kind === 'shift') last = l.date; out.push({ date: (l.kind === 'shift' ? l.date : last) || i.issued, amount: l.amount || 0, hours: l.kind === 'shift' ? l.qty || 0 : 0 }); }
    }
    return out;
  }
  function earnings() {
    const E = workEntries(), t = today(), back = '<button class="linkbtn back" type="button" data-act="back">&lsaquo; Back to overview</button>';
    if (!E.length) return back + '<div class="list"><div class="empty">No earnings yet. They appear here as soon as your first invoice is in.</div></div>';
    const tot = (a, b) => { let e = 0, h = 0; for (const x of E) if (x.date >= a && x.date <= b) { e += x.amount; h += x.hours; } return { e: r2(e), h: r2(h) }; };
    const addDays = (iso, n) => isoOf(new Date(utc(iso) + n * 864e5));
    const mEnd = (yy, mm) => isoOf(new Date(Date.UTC(yy, mm, 0)));
    const all = tot('0000', '9999'), first = E.reduce((m, x) => (x.date < m ? x.date : m), '9999');
    const mon = addDays(t, -((new Date(utc(t)).getUTCDay() + 6) % 7));
    const [y, m] = t.split('-').map(Number), pm = m === 1 ? { y: y - 1, m: 12 } : { y, m: m - 1 };
    const recent = [
      [`This week, ${short(mon)} to ${short(addDays(mon, 6))}`, tot(mon, addDays(mon, 6))],
      [`Last week, ${short(addDays(mon, -7))} to ${short(addDays(mon, -1))}`, tot(addDays(mon, -7), addDays(mon, -1))],
      [`${MON[m - 1]} ${y} so far`, tot(`${y}-${pad(m)}-01`, mEnd(y, m))],
      [`${MON[pm.m - 1]} ${pm.y}`, tot(`${pm.y}-${pad(pm.m)}-01`, mEnd(pm.y, pm.m))],
    ];
    const years = [...new Set(E.map(x => x.date.slice(0, 4)))].sort().reverse().map(yy => [yy, tot(`${yy}-01-01`, `${yy}-12-31`)]);
    const months = [];
    for (let k = 11; k >= 0; k--) {
      const d = new Date(Date.UTC(y, m - 1 - k, 1)), yy = d.getUTCFullYear(), mm = d.getUTCMonth() + 1;
      if (`${yy}-${pad(mm)}` >= first.slice(0, 7)) months.push({ label: `${MON[mm - 1]} ${String(yy).slice(2)}`, v: tot(`${yy}-${pad(mm)}-01`, mEnd(yy, mm)) });
    }
    const cap = Math.max(1, ...months.map(x => x.v.e)), n = state.invoices.size;
    const row = ([label, v]) => `<div><span>${esc(label)}${v.h ? ` <small class="muted">· ${hrs(v.h)}</small>` : ''}</span><span>${eur(v.e)}</span></div>`;
    return back + `
    <section class="block"><h2>Earned all time</h2>
      <div class="big">${eur(all.e)}</div>
      <div class="small muted">Excluding VAT, since ${nice(first)}.</div>
      <div class="stats">
        <div><b>${hrs(all.h)}</b><span>hours worked</span></div>
        <div><b>${all.h ? eur(all.e / all.h) : '&ndash;'}</b><span>per hour</span></div>
        <div><b>${n}</b><span>invoice${n === 1 ? '' : 's'}</span></div>
      </div>
    </section>
    <section class="block"><h2>Lately</h2>
      <div class="rows">${recent.map(row).join('')}</div>
      <div class="small muted">Counted on the day you worked. A shift shows up here once its invoice has arrived, so the current week usually fills in a week later.</div>
    </section>
    <section class="block"><h2>By year</h2><div class="rows">${years.map(row).join('')}</div></section>
    <section class="block"><h2>By month</h2>
      <div class="months">${months.map(x => `<div class="month wide"><span>${x.label}</span><div class="bar"><i class="${x.v.e ? '' : 'zero'}" style="width:${(x.v.e / cap * 100).toFixed(1)}%"></i></div><span class="v">${eur(x.v.e)}</span></div>`).join('')}</div>
    </section>`;
  }
  /* The Dutch VAT return (btw-aangifte): turnover and VAT per rate go in rubriek 1, deductible VAT in 5b.
     The Belastingdienst wants whole euros and allows rounding in the filer's favour. */
  function returnData(Q) {
    const start = state.settings.vatStart, counts = d => !start || (d || '') >= start;
    const inv = invList().filter(i => inQ(i.issued, Q) && counts(i.issued)).reverse();
    const ex = exList().filter(e => inQ(e.date, Q) && counts(e.date)).reverse();
    const b = { t21: 0, v21: 0, t9: 0, v9: 0, t0: 0, tX: 0, vX: 0 };
    for (const i of inv) {
      const lines = i.edited ? [] : (i.lines || []), parts = {};
      if (lines.length) for (const l of lines) parts[l.vatRate || 0] = (parts[l.vatRate || 0] || 0) + (l.amount || 0);
      else parts[i.subtotal ? Math.round((i.vat || 0) / i.subtotal * 100) : 0] = i.subtotal || 0;
      const raw = Object.entries(parts).reduce((t, [r, a]) => t + a * r / 100, 0);
      for (const [r, a] of Object.entries(parts)) {
        const rate = Number(r), v = raw ? (i.vat || 0) * (a * rate / 100) / raw : 0;
        if (rate === 21) { b.t21 += a; b.v21 += v; } else if (rate === 9) { b.t9 += a; b.v9 += v; } else if (rate === 0) b.t0 += a; else { b.tX += a; b.vX += v; }
      }
    }
    const down = n => Math.floor(n + 1e-6), up = n => Math.ceil(n - 1e-6);
    const vin = ex.reduce((t, e) => t + (e.vat || 0), 0), owed = down(b.v21) + down(b.v9);
    return { inv, ex, exact: { t21: r2(b.t21), v21: r2(b.v21), t9: r2(b.t9), v9: r2(b.v9), t0: r2(b.t0), tX: r2(b.tX), vX: r2(b.vX), vin: r2(vin) },

    if (!/(^|[#&])(access_token|error)=/.test(location.hash)) return '';
    const h = new URLSearchParams(location.hash.slice(1)), st = lsGet('kb.oauth');
    history.replaceState(null, '', location.pathname + location.search); lsDel('kb.oauth');
    if (h.get('error') || !h.get('access_token') || !st || h.get('state') !== st) return 'failed';
    state.token = { v: h.get('access_token'), exp: Date.now() + Number(h.get('expires_in') || 3600) * 1000 };
    lsSet('kb.token', JSON.stringify(state.token)); return 'ok';
  }
  async function gm(path) {
    const r = await fetch('https://gmail.googleapis.com/gmail/v1/users/me/' + path, { headers: { Authorization: 'Bearer ' + state.token.v } });
    if (r.status === 401 || r.status === 403) { state.token = null; lsDel('kb.token'); throw { code: 'auth' }; }
    if (!r.ok) throw { code: 'http' };
    return r.json();
  }
  async function syncEmail() {
    const S = state.settings;
    if (syncing || !CLIENT || !state.loaded) return;
    if (!S.senders.length) { state.tab = 'setup'; render(); notice('Add the address your invoices come from first.'); return; }
    if (!tokenOk()) { connect(); return; }
    syncing = 'Checking email'; header();
    try {
      if (!S.gmail) S.gmail = (await gm('profile')).emailAddress || 'your Gmail';
      const q = encodeURIComponent(`from:(${S.senders.join(' OR ')}) has:attachment filename:pdf`);
      const ids = []; let next = '', pages = 0;
      do { const r = await gm(`messages?maxResults=100&q=${q}${next ? '&pageToken=' + encodeURIComponent(next) : ''}`); (r.messages || []).forEach(m => ids.push(m.id)); next = r.nextPageToken || ''; } while (next && ++pages < 10);
      const fresh = ids.filter(id => !S.seenMsgs[id]).reverse(); let added = 0;
      for (let k = 0; k < fresh.length; k++) {
        syncing = `Reading email ${k + 1} of ${fresh.length}`; header();
        const m = await gm(`messages/${fresh[k]}?format=full`), parts = [];
        const from = (((m.payload || {}).headers || []).find(h => h.name.toLowerCase() === 'from') || {}).value || '';
        (function walk(p) { if (!p) return; if (/\.pdf$/i.test(p.filename || '') && p.body && p.body.attachmentId) parts.push(p); (p.parts || []).forEach(walk); })(m.payload);
        for (const p of parts) {
          const key = m.id + ':' + p.partId; if (S.ignored[key]) continue;
          const a = await gm(`messages/${m.id}/attachments/${p.body.attachmentId}`);
          if (await importPdf(Inv.b64ToBytes(a.data), { source: 'gmail', srcKey: key, sender: from, name: p.filename, date: isoOf(new Date(Number(m.internalDate))) }) === 'new') added++;
        }
        S.seenMsgs[m.id] = 1; await saveSettings();
      }
      S.lastCheck = Date.now(); await saveSettings(); notice('');
      toast(added ? `${added} new invoice${added === 1 ? '' : 's'} added` : 'Email checked, nothing new');
    } catch (e) {
      notice(e && e.code === 'auth' ? 'Google needs you to confirm access again. Tap Check email.' : e && e.message === 'offline' ? 'You are offline. The email check runs when you are back online.' : 'The email check did not work. Try again in a minute.', true);
    }
    syncing = ''; render();
  }
  async function disconnect() {
    const t = state.token; state.token = null; lsDel('kb.token');
    if (t) fetch('https://oauth2.googleapis.com/revoke?token=' + encodeURIComponent(t.v), { method: 'POST' }).catch(() => {});
    state.settings.gmail = null; await saveSettings(); render(); toast('Gmail disconnected. Your invoices stay on this device.');
  }

  /* ---------- backup ---------- */
  async function exportBackup() {
    state.busy = 'bk'; render();
    try {
      await loadScript(CDN + 'jszip/3.10.1/jszip.min.js');
      const zip = new JSZip(), files = await DB.all('files');
      zip.file('kasboek.json', JSON.stringify({ app: 'gig-kasboek', version: 1, exported: new Date().toISOString(), settings: state.settings, invoices: [...state.invoices.values()], expenses: [...state.expenses.values()], files: files.map(f => ({ id: f.key, type: f.value.type, name: f.value.name })) }));
      files.forEach(f => zip.file('files/' + f.key, f.value.buf));
      await saveBlob(new Blob([await zip.generateAsync({ type: 'arraybuffer' })], { type: 'application/zip' }), `gig-kasboek-backup-${today()}.zip`);
    } catch (e) { toast(e && e.message === 'offline' ? 'You need to be online the first time you do this.' : 'The backup could not be made.'); }
    state.busy = null; render();
  }
  async function importBackup(file) {
    try {
      await loadScript(CDN + 'jszip/3.10.1/jszip.min.js');
      const zip = await JSZip.loadAsync(file), meta = JSON.parse(await zip.file('kasboek.json').async('string'));
      if (meta.app !== 'gig-kasboek') throw new Error('wrong file');
      for (const f of meta.files || []) { const z = zip.file('files/' + f.id); if (z) await DB.put('files', f.id, { buf: await z.async('arraybuffer'), type: f.type, name: f.name }); }
      for (const i of meta.invoices || []) await DB.put('invoices', i.id, i);
      for (const e of meta.expenses || []) await DB.put('expenses', e.id, e);
      await DB.put('meta', 'settings', Object.assign(defaults(), meta.settings || {}));
      await loadAll(); render(); toast('Backup restored');
    } catch (e) { toast('That file is not a Gig Kasboek backup.'); }
  }

  /* ---------- expenses ---------- */
  const fileType = f => /^(image\/|application\/pdf$)/.test(f.type || '') ? f.type : /\.pdf$/i.test(f.name) ? 'application/pdf' : 'image/jpeg';
  function autoVat() {
    const rate = $('exRate').value, amt = money($('exAmount').value);
    $('exVat').readOnly = rate !== 'custom';
    if (rate !== 'custom') $('exVat').value = isFinite(amt) ? r2(amt * Number(rate) / (100 + Number(rate))).toFixed(2).replace('.', ',') : '';
  }
  function openForm() { const f = $('exForm'); f.reset(); $('exDate').value = today(); $('exErr').hidden = true; autoVat(); f.hidden = false; render(); $('exWhat').focus(); }
  async function saveExpense(ev) {
    ev.preventDefault();
    const what = $('exWhat').value.trim(), date = $('exDate').value, amount = money($('exAmount').value), vat = money($('exVat').value || '0');
    const err = !what ? 'Say what the expense was.' : !isDate(date) ? 'Pick the date on the receipt.' : !(amount > 0) ? 'Fill in what you paid, for example 24,95.' : !(vat >= 0 && vat <= amount) ? 'The VAT amount has to be between zero and what you paid.' : '';
    $('exErr').textContent = err; $('exErr').hidden = !err; if (err) return;
    $('exSave').disabled = true;
    try {
      let receipt = null, receiptType = null; const file = $('exFile').files && $('exFile').files[0];
      if (file) { receiptType = fileType(file); receipt = await putFile(file, receiptType, file.name); }
      const id = rid('e'), doc = { id, what, note: $('exNote').value.trim(), date, amount, vat, rate: $('exRate').value, receipt, receiptType, createdAt: new Date().toISOString() };
      await DB.put('expenses', id, doc); state.expenses.set(id, doc);
      $('exForm').hidden = true; state.Q = qOf(date); toast('Expense saved'); render();
    } catch (e) { $('exErr').textContent = 'Saving did not work. Your device may be out of storage.'; $('exErr').hidden = false; }
    $('exSave').disabled = false;
  }

  /* ---------- events ---------- */
  $('qPrev').onclick = () => { state.Q = qShift(state.Q, -1); state.open = null; render(); };
  $('qNext').onclick = () => { state.Q = qShift(state.Q, 1); state.open = null; render(); };
  $('syncBtn').onclick = () => { if (state.settings.gmail || state.settings.senders.length) syncEmail(); else { state.tab = 'setup'; render(); } };
  $('exForm').addEventListener('submit', saveExpense);
  $('exCancel').onclick = () => { $('exForm').hidden = true; render(); };
  $('exRate').onchange = autoVat; $('exAmount').oninput = autoVat;
  $('pdfFile').onchange = () => { const f = [...($('pdfFile').files || [])]; $('pdfFile').value = ''; if (f.length) addPdfs(f); };
  $('bkFile').onchange = () => { const f = $('bkFile').files && $('bkFile').files[0]; $('bkFile').value = ''; if (f) importBackup(f); };
  $('rcFile').onchange = async () => {
    const file = $('rcFile').files && $('rcFile').files[0], ex = state.expenses.get(state.rcFor); $('rcFile').value = '';
    if (!file || !ex) return;
    try { ex.receiptType = fileType(file); ex.receipt = await putFile(file, ex.receiptType, file.name); await DB.put('expenses', ex.id, ex); toast('Receipt attached'); } catch (e) { toast('The receipt could not be stored.'); }
    render();
  };
  document.querySelector('nav.tabs').addEventListener('click', e => { const b = e.target.closest('button[data-tab]'); if (!b) return; state.tab = b.dataset.tab; lsSet('kb.tab', state.tab); state.sub = null; state.wipe = false; notice(''); window.scrollTo(0, 0); render(); });
  $('view').addEventListener('click', async e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const act = b.dataset.act, id = b.dataset.id, S = state.settings, key = qKey(state.Q);
    try {
      if (act === 'toggle') { state.open = state.open === id ? null : id; state.editInv = null; state.confirmDel = null; }
      else if (act === 'scope') state.invScope = b.dataset.v;
      else if (act === 'earnings') { state.sub = 'earnings'; window.scrollTo(0, 0); }
      else if (act === 'back') { state.sub = null; window.scrollTo(0, 0); }
      else if (act === 'vatreturn') { state.sub = 'vatreturn'; window.scrollTo(0, 0); }
      else if (act === 'sumpdf') return summaryPdf();
      else if (act === 'mergeq') return mergePdfs(true);
      else if (act === 'gosetup') { state.tab = 'setup'; lsSet('kb.tab', 'setup'); }
      else if (act === 'openpdf') return openFile(state.invoices.get(id).pdf);
      else if (act === 'savepdf') { const i = state.invoices.get(id), blob = await fileBlob(i.pdf); return blob ? saveBlob(blob, `Invoice_${i.id}.pdf`) : toast('That file is no longer on this device.'); }
      else if (act === 'merge') return mergePdfs();
      else if (act === 'addpdf') return $('pdfFile').click();
      else if (act === 'edit') state.editInv = id;
      else if (act === 'edcancel') state.editInv = null;
      else if (act === 'edsave') {
        const i = state.invoices.get(id), d = $('edDate').value, h = money($('edHours').value || '0'), sub = money($('edSub').value), vat = money($('edVat').value || '0');
        const err = !isDate(d) ? 'Pick the invoice date.' : !(sub >= 0) || !(vat >= 0) || !(h >= 0) ? 'Use numbers like 121,00.' : '';
        if (err) { $('edErr').textContent = err; $('edErr').hidden = false; return; }
        Object.assign(i, { issued: d, hours: h, subtotal: sub, vat, total: r2(sub + vat), check: false, edited: true });
        await DB.put('invoices', id, i); state.editInv = null; toast('Invoice updated');
      }
      else if (act === 'del') state.confirmDel = id;
      else if (act === 'delno') state.confirmDel = null;
      else if (act === 'invdelyes') { const i = state.invoices.get(id); if (i.srcKey) { S.ignored[i.srcKey] = 1; await saveSettings(); } await dropFile(i.pdf); await DB.del('invoices', id); state.invoices.delete(id); state.confirmDel = null; toast('Invoice deleted'); }
      else if (act === 'addex') return openForm();
      else if (act === 'zoom') state.zoom = state.zoom === id ? null : id;
      else if (act === 'openrc') return openFile(state.expenses.get(id).receipt);
      else if (act === 'addrc') { state.rcFor = id; return $('rcFile').click(); }
      else if (act === 'delyes') { const ex = state.expenses.get(id); await dropFile(ex.receipt); await DB.del('expenses', id); state.expenses.delete(id); state.confirmDel = null; toast('Expense deleted'); }
      else if (act === 'file' || act === 'unfile') { S.filed[key] = act === 'file'; await saveSettings(); }
      else if (act === 'addsender') {
        const v = $('sender').value.trim().toLowerCase();
        if (!/^[^\s@<>()"]+@[^\s@<>()"]+\.[a-z]{2,}$/.test(v)) { toast('That does not look like an email address.'); return; }
        if (!S.senders.includes(v)) { S.senders.push(v); S.seenMsgs = {}; await saveSettings(); }
      }
      else if (act === 'rmsender') { S.senders = S.senders.filter(a => a !== b.dataset.v); await saveSettings(); }
      else if (act === 'connect') return connect();
      else if (act === 'check') return syncEmail();
      else if (act === 'disconnect') return disconnect();
      else if (act === 'savevat') {
        const d = $('vatStart').value, m = $('hoursMark').value.trim();
        S.vatStart = isDate(d) ? d : null; S.hoursMark = m && Number(m) > 0 ? Number(m) : null; await saveSettings(); toast('Saved');
      }
      else if (act === 'export') return exportBackup();
      else if (act === 'import') return $('bkFile').click();
      else if (act === 'wipe') state.wipe = true;
      else if (act === 'wipeno') state.wipe = false;
      else if (act === 'wipeyes') { for (const s of ['invoices', 'expenses', 'files', 'meta']) await DB.clear(s); lsDel('kb.token'); state.token = null; urls.clear(); state.wipe = false; await loadAll(); state.tab = 'overview'; toast('Everything is deleted from this device'); }
      render();
    } catch (err) { toast('That did not save. Try again.'); render(); }
  });

  /* ---------- start ---------- */
  render();
  const born = Date.now();
  function closeSplash() {
    const s = $('splash'); if (!s) return;
    setTimeout(() => { s.classList.add('out'); setTimeout(() => s.remove(), 400); }, Math.max(0, 1100 - (Date.now() - born)));
  }
  (async () => {
    const back = takeRedirect();
    try { const t = JSON.parse(lsGet('kb.token') || 'null'); if (t && t.exp > Date.now()) state.token = t; } catch (e) {}
    try { await loadAll(); } catch (e) { state.failed = true; }
    state.loaded = true; render(); closeSplash();
    if (state.failed) return;
    if (back === 'failed') notice('Google did not give access, so nothing was connected.', true);
    const due = () => CLIENT && state.settings.gmail && tokenOk() && (!state.settings.lastCheck || Date.now() - state.settings.lastCheck > 600000);
    if (back === 'ok' || due()) syncEmail();
    document.addEventListener('visibilitychange', () => { if (!document.hidden) { header(); if (due()) syncEmail(); } });
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  })();
})();
</script>
</body>
</html>
